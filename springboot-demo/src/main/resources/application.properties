# 服务端口（8080 是 Spring Boot 的默认端口）
#
# 提示：如果启动时报 "Port 8080 was already in use"，
#       说明该端口被别的程序占用了，可以临时换一个端口启动：
#       java -jar target/springboot-demo-1.0.0.jar --server.port=8081
server.port=8080

# 应用名
spring.application.name=springboot-demo

# 控制台输出中文不乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================================================
#  数据源（MySQL）
#
#  先导入建表脚本，否则页面上的商品会是空的：
#      mysql --default-character-set=utf8mb4 -u root -p < sql/init.sql
#
#  脚本里的第 2 步会建好 mall / mall123 这个专用账号，
#  所以应用不用 root 也能连库。
#
#  参数逐个解释：
#    useUnicode + characterEncoding=utf8   —— 中文和 emoji 不乱码
#    useSSL=false                          —— 本地开发不做 TLS，省掉一堆证书警告
#    serverTimezone=Asia/Shanghai          —— 不加这个，MySQL 8 驱动会报时区错误
#    allowPublicKeyRetrieval=true          —— 配合 MySQL 8 的 caching_sha2_password
#
#  换库/换密码有三种办法，优先级从低到高：
#    1. 直接改下面这几行
#    2. 启动时加参数：--spring.datasource.password=你的密码
#    3. 设环境变量：DB_PASSWORD=你的密码（下面 ${DB_PASSWORD:mall123} 的写法）
# ============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/mall_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:mall}
spring.datasource.password=${DB_PASSWORD:mall123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池（HikariCP 是 Spring Boot 默认的）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# 会话 Cookie 名，方便在浏览器里辨认
server.servlet.session.cookie.name=MALLSESSION

# ============================================================================
#  文件上传（头像）
#
#  图片存在这个目录里，数据库只记路径。默认是「启动应用时所在目录/uploads」，
#  写绝对路径也行，例如：app.upload-dir=D:/Git-space/springboot-demo/uploads
#  该目录由程序自动创建，不用手动建。
# ============================================================================
app.upload-dir=uploads

# 单个文件最大 2MB、整个请求最大 4MB。
# FileStorageService 里还有一道 2MB 的校验 —— 这里先拦一层，
# 好处是超出大小的请求在进入 Controller 之前就被拒了，不会先占内存。
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=4MB

# ============================================================================
#  Redis（登录验证码）
#
#  本机已装 Redis（D:\Redis），服务名 Redis，端口 6379，没有密码。
#  如果换成有密码的 Redis，补一行 spring.redis.password=xxx。
#
#  验证码的 key 形如 mall:captcha:<32位随机串>，值就是那 4 个字符，
#  由 Redis 自己在 5 分钟后删掉 —— 不用写任何清理代码。
# ============================================================================
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=3000ms
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

# ============================================================================
#  验证码策略
#
#  app.captcha.enabled=true  登录必须带验证码
#  app.captcha.ttl-seconds   验证码有效期（秒），默认 5 分钟
#
#  想临时关掉（比如本地调试嫌麻烦），启动时加参数即可：
#      --app.captcha.enabled=false
#  注意生产环境务必保持 true —— 验证码是为了挡住脚本批量撞库。
# ============================================================================
app.captcha.enabled=true
app.captcha.ttl-seconds=300

# 画验证码图片要用 AWT。无界面模式下行也能正常生成 PNG，
# 设成 true 可以避免服务器环境下 AWT 尝试连接显示设备而报错。
spring.main.headless=true
